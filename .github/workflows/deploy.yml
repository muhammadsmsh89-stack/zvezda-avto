name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install naturel-studio dependencies
        run: npm ci
        working-directory: ./naturel-studio

      - name: Build naturel-studio (static export)
        run: npm run build
        working-directory: ./naturel-studio
        env:
          NODE_ENV: production

      - name: Merge naturel-studio into Pages output
        run: |
          mkdir -p out/naturel-studio
          cp -r naturel-studio/out/. out/naturel-studio/

      - name: Install altair-furniture dependencies
        run: npm ci
        working-directory: ./altair-furniture

      - name: Build altair-furniture (static export)
        run: npm run build
        working-directory: ./altair-furniture
        env:
          NODE_ENV: production

      - name: Merge altair-furniture into Pages output
        run: |
          mkdir -p out/altair-furniture
          cp -r altair-furniture/out/. out/altair-furniture/

      - name: Install liberty-technology dependencies
        run: npm ci
        working-directory: ./liberty-technology

      - name: Build liberty-technology (static export)
        run: npm run build
        working-directory: ./liberty-technology
        env:
          NODE_ENV: production

      - name: Merge liberty-technology into Pages output
        run: |
          mkdir -p out/liberty-technology
          cp -r liberty-technology/out/. out/liberty-technology/

      - name: Install tsar-dverey dependencies
        run: npm ci
        working-directory: ./tsar-dverey

      - name: Build tsar-dverey (static export)
        run: npm run build
        working-directory: ./tsar-dverey
        env:
          NODE_ENV: production

      - name: Merge tsar-dverey into Pages output
        run: |
          mkdir -p out/tsar-dverey
          cp -r tsar-dverey/out/. out/tsar-dverey/

      - name: Install studio-celebrity dependencies
        run: npm ci
        working-directory: ./studio-celebrity

      - name: Build studio-celebrity (static export)
        run: npm run build
        working-directory: ./studio-celebrity
        env:
          NODE_ENV: production

      - name: Merge studio-celebrity into Pages output
        run: |
          mkdir -p out/studio-celebrity
          cp -r studio-celebrity/out/. out/studio-celebrity/

      - name: Install seychas-studio dependencies
        run: npm ci
        working-directory: ./seychas-studio

      - name: Build seychas-studio (static export)
        run: npm run build
        working-directory: ./seychas-studio
        env:
          NODE_ENV: production

      - name: Merge seychas-studio into Pages output
        run: |
          mkdir -p out/seychas-studio
          cp -r seychas-studio/out/. out/seychas-studio/

      - name: Install lovtseva-beauty dependencies
        run: npm ci
        working-directory: ./lovtseva-beauty

      - name: Build lovtseva-beauty (static export)
        run: npm run build
        working-directory: ./lovtseva-beauty
        env:
          NODE_ENV: production

      - name: Merge lovtseva-beauty into Pages output
        run: |
          mkdir -p out/lovtseva-beauty
          cp -r lovtseva-beauty/out/. out/lovtseva-beauty/

      - name: Install hpd-studio dependencies
        run: npm ci
        working-directory: ./hpd-studio

      - name: Build hpd-studio (static export)
        run: npm run build
        working-directory: ./hpd-studio
        env:
          NODE_ENV: production

      - name: Merge hpd-studio into Pages output
        run: |
          mkdir -p out/hpd-studio
          cp -r hpd-studio/out/. out/hpd-studio/

      - name: Install wrapmenow dependencies
        run: npm ci
        working-directory: ./wrapmenow

      - name: Build wrapmenow (static export)
        run: npm run build
        working-directory: ./wrapmenow
        env:
          NODE_ENV: production

      - name: Merge wrapmenow into Pages output
        run: |
          mkdir -p out/wrapmenow
          cp -r wrapmenow/out/. out/wrapmenow/

      - name: Install holy-nails dependencies
        run: npm ci
        working-directory: ./holy-nails

      - name: Build holy-nails (static export)
        run: npm run build
        working-directory: ./holy-nails
        env:
          NODE_ENV: production

      - name: Merge holy-nails into Pages output
        run: |
          mkdir -p out/holy-nails
          cp -r holy-nails/out/. out/holy-nails/

      - name: Install beautyway-clinic dependencies
        run: npm ci
        working-directory: ./beautyway-clinic

      - name: Build beautyway-clinic (static export)
        run: npm run build
        working-directory: ./beautyway-clinic
        env:
          NODE_ENV: production

      - name: Merge beautyway-clinic into Pages output
        run: |
          mkdir -p out/beautyway-clinic
          cp -r beautyway-clinic/out/. out/beautyway-clinic/

      - name: Install modnoe-mesto dependencies
        run: npm ci
        working-directory: ./modnoe-mesto

      - name: Build modnoe-mesto (static export)
        run: npm run build
        working-directory: ./modnoe-mesto
        env:
          NODE_ENV: production

      - name: Merge modnoe-mesto into Pages output
        run: |
          mkdir -p out/modnoe-mesto
          cp -r modnoe-mesto/out/. out/modnoe-mesto/

      - name: Install inunica-clinic dependencies
        run: npm ci
        working-directory: ./inunica-clinic

      - name: Build inunica-clinic (static export)
        run: npm run build
        working-directory: ./inunica-clinic
        env:
          NODE_ENV: production

      - name: Merge inunica-clinic into Pages output
        run: |
          mkdir -p out/inunica-clinic
          cp -r inunica-clinic/out/. out/inunica-clinic/

      - name: Install etel-clinic dependencies
        run: npm ci
        working-directory: ./etel-clinic

      - name: Build etel-clinic (static export)
        run: npm run build
        working-directory: ./etel-clinic
        env:
          NODE_ENV: production

      - name: Merge etel-clinic into Pages output
        run: |
          mkdir -p out/etel-clinic
          cp -r etel-clinic/out/. out/etel-clinic/

      - name: Merge dnk-tsveta into Pages output (static, no build step)
        run: |
          mkdir -p out/dnk-tsveta
          rsync -a --exclude='OWNER-CHECKLIST.md' dnk-tsveta/ out/dnk-tsveta/

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
