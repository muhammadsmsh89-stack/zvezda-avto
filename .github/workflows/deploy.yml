name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install naturel-studio dependencies
        run: npm ci
        working-directory: ./naturel-studio

      - name: Build naturel-studio (static export)
        run: npm run build
        working-directory: ./naturel-studio
        env:
          NODE_ENV: production

      - name: Merge naturel-studio into Pages output
        run: |
          mkdir -p out/naturel-studio
          cp -r naturel-studio/out/. out/naturel-studio/

      - name: Install altair-furniture dependencies
        run: npm ci
        working-directory: ./altair-furniture

      - name: Build altair-furniture (static export)
        run: npm run build
        working-directory: ./altair-furniture
        env:
          NODE_ENV: production

      - name: Merge altair-furniture into Pages output
        run: |
          mkdir -p out/altair-furniture
          cp -r altair-furniture/out/. out/altair-furniture/

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
