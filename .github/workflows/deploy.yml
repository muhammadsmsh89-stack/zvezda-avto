name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install naturel-studio dependencies
        run: npm ci
        working-directory: ./naturel-studio

      - name: Build naturel-studio (static export)
        run: npm run build
        working-directory: ./naturel-studio
        env:
          NODE_ENV: production

      - name: Merge naturel-studio into Pages output
        run: |
          mkdir -p out/naturel-studio
          cp -r naturel-studio/out/. out/naturel-studio/

      - name: Install altair-furniture dependencies
        run: npm ci
        working-directory: ./altair-furniture

      - name: Build altair-furniture (static export)
        run: npm run build
        working-directory: ./altair-furniture
        env:
          NODE_ENV: production

      - name: Merge altair-furniture into Pages output
        run: |
          mkdir -p out/altair-furniture
          cp -r altair-furniture/out/. out/altair-furniture/

      - name: Install liberty-technology dependencies
        run: npm ci
        working-directory: ./liberty-technology

      - name: Build liberty-technology (static export)
        run: npm run build
        working-directory: ./liberty-technology
        env:
          NODE_ENV: production

      - name: Merge liberty-technology into Pages output
        run: |
          mkdir -p out/liberty-technology
          cp -r liberty-technology/out/. out/liberty-technology/

      - name: Install tsar-dverey dependencies
        run: npm ci
        working-directory: ./tsar-dverey

      - name: Build tsar-dverey (static export)
        run: npm run build
        working-directory: ./tsar-dverey
        env:
          NODE_ENV: production

      - name: Merge tsar-dverey into Pages output
        run: |
          mkdir -p out/tsar-dverey
          cp -r tsar-dverey/out/. out/tsar-dverey/

      - name: Install studio-celebrity dependencies
        run: npm ci
        working-directory: ./studio-celebrity

      - name: Build studio-celebrity (static export)
        run: npm run build
        working-directory: ./studio-celebrity
        env:
          NODE_ENV: production

      - name: Merge studio-celebrity into Pages output
        run: |
          mkdir -p out/studio-celebrity
          cp -r studio-celebrity/out/. out/studio-celebrity/

      - name: Install seychas-studio dependencies
        run: npm ci
        working-directory: ./seychas-studio

      - name: Build seychas-studio (static export)
        run: npm run build
        working-directory: ./seychas-studio
        env:
          NODE_ENV: production

      - name: Merge seychas-studio into Pages output
        run: |
          mkdir -p out/seychas-studio
          cp -r seychas-studio/out/. out/seychas-studio/

      - name: Install lovtseva-beauty dependencies
        run: npm ci
        working-directory: ./lovtseva-beauty

      - name: Build lovtseva-beauty (static export)
        run: npm run build
        working-directory: ./lovtseva-beauty
        env:
          NODE_ENV: production

      - name: Merge lovtseva-beauty into Pages output
        run: |
          mkdir -p out/lovtseva-beauty
          cp -r lovtseva-beauty/out/. out/lovtseva-beauty/

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
